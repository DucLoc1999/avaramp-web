# AvaRamp web channel — local stack (single service on :3002).
#
# For co-located local dev, payment_svc's docker-compose.local.yml publishes its
# API on host port 3001, so set in backend/.env.local:
#   PAYMENT_SVC_BASE_URL=http://host.docker.internal:3001
# (host.docker.internal is mapped to the host via extra_hosts below).
#
# Usage: docker compose -f docker-compose.local.yml up --build

services:
  db:
    image: postgres:16-alpine
    container_name: avarampl-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: avaramp
    ports:
      - '${AVARAMP_DB_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d avaramp']
      interval: 5s
      timeout: 5s
      retries: 10

  avarampl:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: avarampl:local
    container_name: avarampl-local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${AVARAMP_HOST_PORT:-3002}:3002'
    env_file:
      - path: ./backend/.env.local
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      HOST: 0.0.0.0
      SPA_DIST_DIR: ../dist/spa
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: avaramp
      DB_SSL: 'false'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./backend/logs:/app/backend/logs
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  db-data:
