# AvaRamp web channel — local stack (single service on :3002).
#
# For co-located local dev, payment_svc's docker-compose.local.yml publishes its
# API on host port 3001, so set in backend/.env.local:
#   PAYMENT_SVC_BASE_URL=http://host.docker.internal:3001
# (host.docker.internal is mapped to the host via extra_hosts below).
#
# Usage: docker compose -f docker-compose.local.yml up --build

services:
  avarampl:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: avarampl:local
    container_name: avarampl-local
    restart: unless-stopped
    ports:
      - '${AVARAMP_HOST_PORT:-3002}:3002'
    env_file:
      - path: ./backend/.env.local
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      HOST: 0.0.0.0
      SPA_DIST_DIR: ../dist/spa
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./backend/logs:/app/backend/logs
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
